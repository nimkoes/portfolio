# 포트폴리오를 빌드하고 https://nimkoes.github.io/portfolio/ 에만 배포합니다.
# 다른 저장소를 호출하거나 변경하지 않습니다.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 빌드 job 은 읽기 권한만 갖고(configure-pages 가 Pages 설정을 읽으므로 pages: read 포함),
# Pages 배포 권한은 deploy job 에만 줍니다.
permissions:
  contents: read
  pages: read

# 이 저장소의 Pages 배포만 한 번에 하나씩 실행합니다. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      GITHUB_PAGES_BASE_PATH: "/portfolio"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # ai:loop(콘텐츠 점검 리포트, 예외 시에만 실패), lint, 정적 빌드, SEO 산출물 검사를 한 번에 실행합니다.
      - name: Check and build
        run: npm run check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
